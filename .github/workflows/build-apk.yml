name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform & build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sumo-rater-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release with APK
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          NOTES="Debug-signed APK built from commit ${{ github.sha }} on branch \`${{ github.ref_name }}\`. Install by downloading \`app-debug.apk\` below and opening it on your phone (you may need to allow \"install unknown apps\" for your browser/file manager)."
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          for attempt in 1 2 3; do
            if gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
              --title "Sumo Rater APK (build ${{ github.run_number }})" \
              --notes "$NOTES" \
              --prerelease; then
              echo "Release published on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            sleep 15
          done
          echo "::warning::Failed to publish release after 3 attempts; APK is still available as a workflow artifact."
