name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform & build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore signing key from secret
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > keystore/sumo-rater.jks
            echo "Signing key restored from secret."
          fi

      - name: Build debug APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK is signed with the shared key
        run: |
          if [ ! -f keystore/sumo-rater.jks ]; then
            echo "::warning::No shared signing key; this APK will NOT install as an update over a previous build."
            exit 0
          fi
          EXPECTED=8db0c5bfe17fde1350b9b5d029e7a368f386f6b13efa5d3dba68c8a2576a5aa7
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee signer.txt
          grep -qi "SHA-256 digest: $EXPECTED" signer.txt || { echo "::error::APK not signed with keystore/sumo-rater.jks; it would not install as an update"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sumo-rater-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release with APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          NOTES="Debug-signed APK built from commit ${{ github.sha }} on branch \`${{ github.ref_name }}\`. Install by downloading \`app-debug.apk\` below and opening it on your phone (you may need to allow \"install unknown apps\" for your browser/file manager)."
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          for attempt in 1 2 3; do
            # --target: tag the commit that was built; without it every tag lands on
            # main's old commit and GitHub lists the releases out of order.
            if gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
              --target "${{ github.sha }}" \
              --title "Sumo Rater APK (build ${{ github.run_number }})" \
              --notes "$NOTES" \
              --prerelease; then
              echo "Release published on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            sleep 15
          done
          echo "::warning::Failed to publish release after 3 attempts; APK is still available as a workflow artifact."
